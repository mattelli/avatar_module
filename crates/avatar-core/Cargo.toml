[package]
name = "avatar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core pipeline: text -> Piper TTS -> viseme lip-sync -> wgpu render -> MP4"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
image = "0.25"
wgpu = "26"
bytemuck = { version = "1", features = ["derive"] }
fdk-aac = { version = "0.8", optional = true }
openh264 = "0.9"
mp4 = "0.14"
# Async runtime for blocking on wgpu device requests in the sync pipeline.
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

# Face detection (SeetaFace via rustface, pure Rust, BSD-2-Clause) — plan 4.
rustface = "0.1"

# Piper TTS (embedded, in-process ONNX Runtime) — task 3.
piper-rs = { version = "0.2", optional = true }
espeak-rs = { version = "0.2", optional = true, default-features = false }

# Plan 5 — Wav2Lip + ExpNet talking-head backend (complementary crates).
# Optional: the classic atlas/warp path stays the default until the models
# are wired in (task 8); enabling `talking-head` pulls in the Burn-based
# crates.
wav2lip = { path = "../wav2lip", optional = true }
expnet = { path = "../expnet", optional = true }

[features]
default = ["embedded"]
# Embedded backend: piper-rs runs the ONNX model in-process.
embedded = ["dep:piper-rs", "dep:espeak-rs"]
# Subprocess fallback: shells out to the `piper` CLI binary.
subprocess = []
# FDK-AAC encoder for the audio track (optional).
aac = ["dep:fdk-aac"]
# Plan 5: Wav2Lip + ExpNet talking-head backend (Burn).
talking-head = ["dep:wav2lip", "dep:expnet"]

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[[example]]
name = "talking_head_bench"
required-features = ["talking-head"]

[[example]]
name = "face_detect_debug"
required-features = []
