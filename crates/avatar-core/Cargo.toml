[package]
name = "avatar-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Core pipeline: text -> Piper TTS -> Wav2Lip+ExpNet talking head -> MP4"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
image = "0.25"
fdk-aac = { version = "0.8", optional = true }
openh264 = "0.9"
mp4 = "0.14"

# Face detection (SeetaFace via rustface, pure Rust, BSD-2-Clause) — plan 4.
rustface = "0.1"

# Piper TTS (embedded, in-process ONNX Runtime) — task 3.
piper-rs = { version = "0.2", optional = true }
espeak-rs = { version = "0.2", optional = true, default-features = false }

# Plan 5 — Wav2Lip + ExpNet talking-head backend (required, the only backend).
wav2lip = { path = "../wav2lip" }
expnet = { path = "../expnet" }

[features]
default = ["embedded"]
# Embedded backend: piper-rs runs the ONNX model in-process.
embedded = ["dep:piper-rs", "dep:espeak-rs"]
# Subprocess fallback: shells out to the `piper` CLI binary.
subprocess = []
# FDK-AAC encoder for the audio track (optional).
aac = ["dep:fdk-aac"]

[[example]]
name = "talking_head_bench"
required-features = []

[[example]]
name = "render_talking_head_api"
required-features = []

[[example]]
name = "face_detect_debug"
required-features = []
